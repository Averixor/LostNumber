plugins {
    id 'com.android.library' version '8.6.1'
}

def godotAar = file('../../build/libs/release/godot-lib.template_release.aar')
def codeqlBuild = project.hasProperty('codeqlBuild')
def useGodotStubs = codeqlBuild && !godotAar.exists()

android {
    namespace 'com.averixor.lostnumber'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            if (useGodotStubs) {
                java.srcDir "${rootDir}/../codeql-stubs/java"
            }
        }
    }
}

dependencies {
    if (godotAar.exists()) {
        compileOnly files(godotAar)
    } else if (!useGodotStubs) {
        throw new org.gradle.api.GradleException(
            "Missing ${godotAar}. Run Godot Android export or pass -PcodeqlBuild=true."
        )
    }
}
