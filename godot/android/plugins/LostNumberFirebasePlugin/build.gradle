plugins {
    id 'com.android.library' version '8.6.1'
}

def godotAar = file('../../build/libs/release/godot-lib.template_release.aar')
def codeqlBuild = project.hasProperty('codeqlBuild')
def useGodotStubs = codeqlBuild && !godotAar.exists()

android {
    namespace 'com.averixor.lostnumber.firebase'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            if (useGodotStubs) {
                java.srcDir "${rootDir}/../codeql-stubs/java"
            }
        }
    }
}

dependencies {
    if (godotAar.exists()) {
        compileOnly files(godotAar)
    } else if (!useGodotStubs) {
        throw new GradleException(
            "Missing ${godotAar}. Run Godot Android export or pass -PcodeqlBuild=true."
        )
    }
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
